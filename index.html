<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>aiplanrank — ¥10 = 多少 Token</title><style>body{font-family:system-ui;max-width:800px;margin:24px auto;padding:0 16px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px;text-align:left}th{background:#f5f5f5}</style><h1>aiplanrank <small>¥10 = 多少 Token*</small></h1><p>*估算值，公式见表。Token口径精确，请求口径按假设折算。</p><table id="t"><tr><th>套餐</th><th>价格</th><th>¥10理论Token</th><th>公式</th></tr></table><script>fetch('plans.json').then(r=>r.json()).then(d=>{const t=document.getElementById('t');d.sort((a,b)=>parseFloat(b.theoretical_tokens_per_10cny.replace(/[^0-9.]/g,''))-parseFloat(a.theoretical_tokens_per_10cny.replace(/[^0-9.]/g,'')));for(const p of d){const tr=document.createElement('tr');tr.innerHTML=`<td>${p.name}<br><small>${p.quota||p.credits}</small></td><td>${p.price}</td><td><b>${p.theoretical_tokens_per_10cny}</b></td><td><small>${p.formula}</small></td>`;t.appendChild(tr);}});</script>
